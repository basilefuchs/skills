name: CI

on:
  push:
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests du script de vérification
        run: python3 -m unittest discover -s tests -v
      - name: Vérification des skills du dépôt
        run: python3 check_skills.py
